# Project name comes from the compose invocation (-p) or the directory name,
# so rehearsals can run isolated stacks (e.g. -p form-management-rehearsal).
# Default volume: <project>_sql-data — distinct from any pre-existing volume.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot initializer: creates form_structure when missing, applies the
  # baseline NewFile1.sql (skipped if tables exist) and the guarded migrations
  # 001/002. Idempotent, so it is safe to run on every `docker compose up`.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}"
    volumes:
      - ./api/FormManagementApi/NewFile1.sql:/baseline.sql:ro
      - ./api/FormManagementApi/Database/Migrations:/migrations:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd
        export SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
        run_sql() {
          local db="$$1"; shift
          { echo "SET QUOTED_IDENTIFIER ON;"; cat; } | "$$SQLCMD" -S sqlserver -U sa -C -d "$$db" -b -W "$$@"
        }
        echo "Ensuring database form_structure exists..."
        # First boot after a SQL Server upgrade can leave the server answering
        # on master while form_structure is still recovering or model is being
        # upgraded; retry until the database accepts connections.
        READY=0
        for i in $$(seq 1 60); do
          if "$$SQLCMD" -S sqlserver -U sa -C -b -Q "IF DB_ID('form_structure') IS NULL CREATE DATABASE form_structure;" >/dev/null 2>&1 \
            && "$$SQLCMD" -S sqlserver -U sa -C -d form_structure -b -Q "SET NOCOUNT ON; SELECT 1;" >/dev/null 2>&1; then
            READY=1
            break
          fi
          sleep 2
        done
        if [ "$$READY" != "1" ]; then
          echo "SQL Server did not accept connections to form_structure in time."
          exit 1
        fi
        EXISTS=0
        for i in 1 2 3 4 5; do
          if EXISTS=$$("$$SQLCMD" -S sqlserver -U sa -C -d form_structure -h -1 -W -b -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE name='Forms';" 2>/dev/null | tr -d '[:space:]'); then
            break
          fi
          sleep 2
        done
        if [ "$$EXISTS" = "0" ]; then
          echo "Applying baseline NewFile1.sql..."
          run_sql form_structure < /baseline.sql
        else
          echo "Baseline already present; skipping NewFile1.sql."
        fi
        for f in /migrations/001_*.sql /migrations/002_*.sql; do
          echo "Applying $$(basename "$$f")..."
          run_sql form_structure < "$$f"
        done
        echo "Database initialization complete."

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5165"
      ConnectionStrings__DockerConnection: "Server=sqlserver,1433;Database=form_structure;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    ports:
      - "5165:5165"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: "http://localhost:5165"
      # Let pnpm purge/reinstall node_modules non-interactively on start.
      CI: "true"
    ports:
      - "5173:5173"
    volumes:
      # node_modules lives in a named volume so the container keeps its
      # Linux binaries regardless of what the host has installed.
      - web-node-modules:/app/node_modules
    # `docker compose watch` syncs source edits into the container, where
    # Vite picks them up with native inotify (fast on Windows hosts; a bind
    # mount would require slow polling). Plain `docker compose up` still works
    # and serves the code baked into the image.
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app
          ignore:
            - node_modules/
            - dist/
            - test-results/
            - playwright-report/
    depends_on:
      - api

volumes:
  sql-data:
  web-node-modules:
